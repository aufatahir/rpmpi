                    "1.7.3	Mengaplikasi bacaan mad wajib Muttasil, mad Jaiz Munfasil dan Mad Silah Thowilah dengan betul dan bertajwid dalam Pembacaan al-Qur`an",
                    "1.7.4	Membaca al-Qur`an dengan betul dan bertajwid dalam kehidupan harian secara beradab dan istiqomah",
                    "1.8.1	Membaca kalimah dan potongan ayat yang mengandungi bacaan mad lazim harfi,mad lazim kalimi,dan mad farq dengan betul dan bertajwid",
                    "1.8.2	Mengenal pasti kalimah dan potongan ayat yang mengandungi bacaan mad lazim harfi,mad lazim kalimi,dan mad farq dengan betul",
                    "1.8.3	Mengaplikasi bacaan mad lazim harfi,mad lazim kalimi,dan mad farq dengan betul dan bertajwid dalam Pembacaan al-Qur`an",
                    "1.8.4	Membaca al-Qur`an dengan betul dan bertajwid dalam kehidupan harian secara beradab dan istiqomah"
                ],
                "Hadis": [
                    "2.1.1 Menyatakan tuntutan hadis menyayangi orang muda dan menghormati orang tua",
                    "2.1.2 Menerangkan kepentingan berkasih sayang dalam masyarakat"
                ],
                "Aqidah": [
                    "3.1.1 Menyatakan maksud nama Allah Al-Khalid dan Al-Musawwir",
                    "3.1.2 Menerangkan hukum beriman dengan Al-Khalid dan Al-Musawwir",
                    "3.2.1 Menerangkan konsep dosa dan pahala"
                ],
                "Ibadah": [
                    "4.1.1 Menyatakan maksud solat jenazah",
                    "4.1.2 Menjelaskan kaifiat dan rukun solat jenazah"
                ],
                "Sirah": [
                    "5.1.1 Menyatakan peristiwa pembukaan kota Mekah (Fathu Makkah)",
                    "5.1.2 Menganalisis faktor kejayaan pembukaan kota Mekah"
                ],
                "Adab": [
                    "6.1.1 Menyatakan adab memelihara maruah diri",
                    "6.1.2 Menghuraikan kepentingan menjaga maruah diri"
                ],
                "Jawi": [
                    "7.1.1 Membaca teks jawi pelbagai tema dengan lancar",
                    "7.1.2 Menulis khat Riq'ah dengan kaedah yang betul"
                ]
            }
        };

        const BIDANGS = ["Al-Quran", "Hadis", "Aqidah", "Ibadah", "Sirah", "Adab", "Jawi"];

        function App() {
            const [selectedYear, setSelectedYear] = useState("Tahun 4");
            const [selectedClass, setSelectedClass] = useState("");
            const [selectedBidang, setSelectedBidang] = useState("Al-Quran");
            const [selectedSP, setSelectedSP] = useState("");
            const [scores, setScores] = useState({});
            const [activeTab, setActiveTab] = useState("perekodan"); // perekodan, analisis, laporan-ind, laporan-kelas, import-export
            const [searchQuery, setSearchQuery] = useState("");
            const [notification, setNotification] = useState(null);
            const [confirmReset, setConfirmReset] = useState(false);
            const [selectedStudentForReport, setSelectedStudentForReport] = useState("");
            const [isExporting, setIsExporting] = useState(false);

            // Fetch available classes based on Year
            const availableClasses = useMemo(() => {
                if (!selectedYear) return [];
                return Object.keys(STUDENT_DATA[selectedYear] || {});
            }, [selectedYear]);

            // Set default class when year changes
            useEffect(() => {
                if (availableClasses.length > 0) {
                    setSelectedClass(availableClasses[0]);
                } else {
                    setSelectedClass("");
                }
            }, [selectedYear, availableClasses]);

            // Fetch available SPs based on Year + Bidang
            const availableSPs = useMemo(() => {
                if (!selectedYear || !selectedBidang) return [];
                return STANDARDS_DATA[selectedYear]?.[selectedBidang] || [];
            }, [selectedYear, selectedBidang]);

            // Set default SP when year or bidang changes
            useEffect(() => {
                if (availableSPs.length > 0) {
                    setSelectedSP(availableSPs[0]);
                } else {
                    setSelectedSP("");
                }
            }, [selectedYear, selectedBidang, availableSPs]);

            useEffect(() => {
                // Check if there is data in hash first (from shared link)
                const hash = window.location.hash;
                if (hash && hash.startsWith("#data=")) {
                    try {
                        const encodedData = hash.substring(6);
                        const decodedString = decodeURIComponent(atob(encodedData));
                        const sharedScores = JSON.parse(decodedString);
                        if (sharedScores && typeof sharedScores === 'object') {
                            setScores(sharedScores);
                            localStorage.setItem("pi_tp_scores", JSON.stringify(sharedScores));
                            showNotification("Berjaya mengimport data perkongsian!", "success");
                            // Clear hash so it doesn't prompt again
                            window.location.hash = "";
                        }
                    } catch (e) {
                        showNotification("Gagal membaca pautan perkongsian data.", "error");
                    }
                } else {
                    // Normal loading from local storage
                    const storedScores = localStorage.getItem("pi_tp_scores");
                    if (storedScores) {
                        try {
                            setScores(JSON.parse(storedScores));
                        } catch (e) {
                            console.error("Error loading scores from localstorage", e);
                        }
                    }
                }
            }, []);

            // Auto-select first student in class when active tab changes to individual report
            useEffect(() => {
                if (selectedYear && selectedClass) {
                    const students = STUDENT_DATA[selectedYear]?.[selectedClass] || [];
                    if (students.length > 0 && !students.includes(selectedStudentForReport)) {
                        setSelectedStudentForReport(students[0]);
                    }
                }
            }, [selectedYear, selectedClass, activeTab]);

            // Save to LocalStorage helper
            const saveScores = (newScores) => {
                setScores(newScores);
                localStorage.setItem("pi_tp_scores", JSON.stringify(newScores));
            };

            const showNotification = (message, type = "success") => {
                setNotification({ message, type });
                setTimeout(() => setNotification(null), 3000);
            };

            const handleScoreChange = (studentName, tpValue) => {
                const updatedScores = { ...scores };
                
                if (!updatedScores[studentName]) updatedScores[studentName] = {};
                if (!updatedScores[studentName][selectedYear]) updatedScores[studentName][selectedYear] = {};
                if (!updatedScores[studentName][selectedYear][selectedClass]) updatedScores[studentName][selectedYear][selectedClass] = {};
                if (!updatedScores[studentName][selectedYear][selectedClass][selectedBidang]) updatedScores[studentName][selectedYear][selectedClass][selectedBidang] = {};
                
                updatedScores[studentName][selectedYear][selectedClass][selectedBidang][selectedSP] = tpValue;
                
                saveScores(updatedScores);
            };

            // Set all students to a specific TP for current selection
            const handleBatchSetTP = (tpValue) => {
                const students = STUDENT_DATA[selectedYear]?.[selectedClass] || [];
                const updatedScores = { ...scores };

                students.forEach(studentName => {
                    if (!updatedScores[studentName]) updatedScores[studentName] = {};
                    if (!updatedScores[studentName][selectedYear]) updatedScores[studentName][selectedYear] = {};
                    if (!updatedScores[studentName][selectedYear][selectedClass]) updatedScores[studentName][selectedYear][selectedClass] = {};
                    if (!updatedScores[studentName][selectedYear][selectedClass][selectedBidang]) updatedScores[studentName][selectedYear][selectedClass][selectedBidang] = {};
                    
                    updatedScores[studentName][selectedYear][selectedClass][selectedBidang][selectedSP] = tpValue;
                });

                saveScores(updatedScores);
                showNotification(`Semua murid disetkan kepada TP ${tpValue}`, "success");
            };

            // Calculate TP average for a student in a specific Bidang
            const calculateBidangAverage = (studentName, year, className, bidang) => {
                const studentScores = scores[studentName]?.[year]?.[className]?.[bidang] || {};
                const spList = STANDARDS_DATA[year]?.[bidang] || [];
                
                let sum = 0;
                let count = 0;
                
                spList.forEach(sp => {
                    const val = studentScores[sp];
                    if (val && typeof val === 'number') {
                        sum += val;
                        count++;
                    }
                });
                
                if (count === 0) return "-";
                return Math.round(sum / count);
            };

            // Calculate overall TP average across all 7 Bidang for a student
            const calculateOverallAverage = (studentName, year, className) => {
                let sum = 0;
                let count = 0;

                BIDANGS.forEach(bidang => {
                    const avg = calculateBidangAverage(studentName, year, className, bidang);
                    if (avg !== "-") {
                        sum += avg;
                        count++;
                    }
                });

                if (count === 0) return "-";
                return Math.round(sum / count);
            };

            // Reset scores for current Year + Class
            const resetClassScores = () => {
                const updatedScores = { ...scores };
                const students = STUDENT_DATA[selectedYear]?.[selectedClass] || [];
                
                students.forEach(studentName => {
                    if (updatedScores[studentName]?.[selectedYear]?.[selectedClass]) {
                        delete updatedScores[studentName][selectedYear][selectedClass];
                    }
                });
                
                saveScores(updatedScores);
                setConfirmReset(false);
                showNotification("Rekod prestasi kelas ini telah dipadamkan.", "info");
            };

            const generateShareLink = () => {
                try {
                    const serializedData = JSON.stringify(scores);
                    const encodedData = btoa(encodeURIComponent(serializedData));
                    const shareUrl = `${window.location.origin}${window.location.pathname}#data=${encodedData}`;
                    
                    // Copy to clipboard
                    const tempInput = document.createElement("input");
                    tempInput.value = shareUrl;
                    document.body.appendChild(tempInput);
                    tempInput.select();
                    document.execCommand("copy");
                    document.body.removeChild(tempInput);
                    
                    showNotification("Pautan kongsi berjaya disalin ke clipboard!", "success");
                } catch (e) {
                    showNotification("Gagal menjana pautan kongsi.", "error");
                }
            };

            const printIndividualPDF = (studentName) => {
                setIsExporting(true);
                setTimeout(() => {
                    const element = document.getElementById(`individual-report-card-${studentName.replace(/\s+/g, '-')}`);
                    const opt = {
                        margin:       0.5,
                        filename:     `Laporan_PI_${studentName.replace(/\s+/g, '_')}.pdf`,
                        image:        { type: 'jpeg', quality: 0.98 },
                        html2canvas:  { scale: 2 },
                        jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
                    };
                    html2pdf().from(element).set(opt).save().then(() => {
                        setIsExporting(false);
                        showNotification("Sijil PDF individu berjaya dimuat turun!");
                    });
                }, 100);
            };

            const printClassPDF = () => {
                setIsExporting(true);
                setTimeout(() => {
                    const element = document.getElementById('class-report-sheet');
                    const opt = {
                        margin:       [0.3, 0.3, 0.3, 0.3],
                        filename:     `Spreasheet_Kelas_${selectedYear.replace(/\s+/g, '_')}_${selectedClass.replace(/\s+/g, '_')}.pdf`,
                        image:        { type: 'jpeg', quality: 0.98 },
                        html2canvas:  { scale: 2, useCORS: true },
                        jsPDF:        { unit: 'in', format: 'a4', orientation: 'landscape' }
                    };
                    html2pdf().from(element).set(opt).save().then(() => {
                        setIsExporting(false);
                        showNotification("Spreadsheet Kelas PDF berjaya dimuat turun!");
                    });
                }, 100);
            };

            // Backup & Restore files
            const handleExportJSON = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(scores, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `pi_perekodan_backup_${new Date().toISOString().slice(0,10)}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
                showNotification("Backup fail JSON berjaya!");
            };

            const handleImportJSON = (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const importedData = JSON.parse(e.target.result);
                        if (importedData && typeof importedData === 'object') {
                            const merged = { ...scores, ...importedData };
                            saveScores(merged);
                            showNotification("Data berjaya diimport daripada fail backup!", "success");
                        } else {
                            showNotification("Format fail backup tidak sah.", "error");
                        }
                    } catch (err) {
                        showNotification("Gagal membaca fail backup.", "error");
                    }
                };
                reader.readAsText(file);
            };

            // Filter student list
            const filteredStudents = useMemo(() => {
                const students = STUDENT_DATA[selectedYear]?.[selectedClass] || [];
                if (!searchQuery) return students;
                return students.filter(name => name.toLowerCase().includes(searchQuery.toLowerCase()));
            }, [selectedYear, selectedClass, searchQuery]);

            return (
                <div class="flex-1 flex flex-col">
                    
                    {}
                    {notification && (
                        <div class={`fixed top-4 right-4 z-50 flex items-center p-4 rounded-xl shadow-lg border transition-all transform duration-300 ${
                            notification.type === 'success' ? 'bg-emerald-50 border-emerald-200 text-emerald-800' :
                            notification.type === 'error' ? 'bg-rose-50 border-rose-200 text-rose-800' :
                            'bg-sky-50 border-sky-200 text-sky-800'
                        }`}>
                            <i class={`fa-solid mr-3 ${
                                notification.type === 'success' ? 'fa-circle-check text-emerald-500' :
                                notification.type === 'error' ? 'fa-circle-exclamation text-rose-500' :
                                'fa-circle-info text-sky-500'
                            }`}></i>
                            <span class="font-medium text-sm">{notification.message}</span>
                        </div>
                    )}

                    {}
                    <header class="bg-gradient-to-r from-emerald-800 to-teal-900 text-white shadow-md no-print">
                        <div class="max-w-7xl mx-auto px-4 py-4 sm:py-6 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div class="flex items-center space-x-3.5">
                                <div class="bg-emerald-100/10 p-3 rounded-2xl border border-emerald-500/20">
                                    <i class="fa-solid fa-mosque text-3xl text-emerald-300"></i>
                                </div>
                                <div>
                                    <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-emerald-50">Rekod Perkembangan Murid</h1>
                                    <p class="text-xs sm:text-sm text-emerald-200 font-medium">Pentaksiran Tahap Penguasaan Pendidikan Islam KSSR</p>
                                </div>
                            </div>
                            
                            <div class="flex flex-wrap items-center gap-2.5">
                                <button 
                                    onClick={generateShareLink} 
                                    class="bg-emerald-700/60 hover:bg-emerald-700 text-emerald-50 font-semibold px-4 py-2 rounded-xl border border-emerald-600/40 transition duration-200 flex items-center gap-2 text-sm"
                                    title="Salin pautan perkongsian data pentaksiran"
                                >
                                    <i class="fa-solid fa-share-nodes"></i>
                                    <span>Pautan Kongsi</span>
                                </button>
                                <button 
                                    onClick={() => setActiveTab("import-export")}
                                    class="bg-emerald-900/40 hover:bg-emerald-900/80 text-emerald-100 font-semibold px-4 py-2 rounded-xl border border-emerald-800/40 transition duration-200 flex items-center gap-2 text-sm"
                                >
                                    <i class="fa-solid fa-file-invoice"></i>
                                    <span>Urus Fail</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    {}
                    <nav class="bg-white border-b border-slate-200 sticky top-0 z-30 no-print shadow-sm">
                        <div class="max-w-7xl mx-auto px-4">
                            <div class="flex space-x-1 sm:space-x-4 overflow-x-auto py-2.5">
                                <button 
                                    onClick={() => setActiveTab("perekodan")}
                                    class={`flex-none px-4 py-2 rounded-xl text-sm font-semibold transition-all duration-150 ${
                                        activeTab === "perekodan" 
                                        ? "bg-emerald-50 text-emerald-700 shadow-sm border border-emerald-100" 
                                        : "text-slate-600 hover:bg-slate-50 hover:text-slate-900"
                                    }`}
                                >
                                    <i class="fa-solid fa-pen-to-square mr-2"></i>Kemasukan TP
                                </button>
                                <button 
                                    onClick={() => setActiveTab("analisis")}
                                    class={`flex-none px-4 py-2 rounded-xl text-sm font-semibold transition-all duration-150 ${
                                        activeTab === "analisis" 
                                        ? "bg-emerald-50 text-emerald-700 shadow-sm border border-emerald-100" 
                                        : "text-slate-600 hover:bg-slate-50 hover:text-slate-900"
                                    }`}
                                >
                                    <i class="fa-solid fa-chart-simple mr-2"></i>Analisis Kelas
                                </button>
                                <button 
                                    onClick={() => setActiveTab("laporan-ind")}
                                    class={`flex-none px-4 py-2 rounded-xl text-sm font-semibold transition-all duration-150 ${
                                        activeTab === "laporan-ind" 
                                        ? "bg-emerald-50 text-emerald-700 shadow-sm border border-emerald-100" 
                                        : "text-slate-600 hover:bg-slate-50 hover:text-slate-900"
                                    }`}
                                >
                                    <i class="fa-solid fa-address-card mr-2"></i>Laporan Individu
                                </button>
                                <button 
                                    onClick={() => setActiveTab("laporan-kelas")}
                                    class={`flex-none px-4 py-2 rounded-xl text-sm font-semibold transition-all duration-150 ${
                                        activeTab === "laporan-kelas" 
                                        ? "bg-emerald-50 text-emerald-700 shadow-sm border border-emerald-100" 
                                        : "text-slate-600 hover:bg-slate-50 hover:text-slate-900"
                                    }`}
                                >
                                    <i class="fa-solid fa-table mr-2"></i>Cetak Laporan Kelas
                                </button>
                            </div>
                        </div>
                    </nav>

                    {}
                    <div class="bg-white border-b border-slate-200 py-4 shadow-sm no-print">
                        <div class="max-w-7xl mx-auto px-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="flex flex-col sm:flex-row gap-3">
                                <div class="flex-1">
                                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">1. Pilih Tahun</label>
                                    <div class="relative">
                                        <select 
                                            value={selectedYear} 
                                            onChange={(e) => setSelectedYear(e.target.value)}
                                            class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl px-3.5 py-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition appearance-none"
                                        >
                                            <option value="Tahun 4">Tahun 4</option>
                                            <option value="Tahun 5">Tahun 5</option>
                                            <option value="Tahun 6">Tahun 6</option>
                                        </select>
                                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-500">
                                            <i class="fa-solid fa-chevron-down text-xs mr-1"></i>
                                        </div>
                                    </div>
                                </div>
                                <div class="flex-1">
                                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">2. Pilih Kelas</label>
                                    <div class="relative">
                                        <select 
                                            value={selectedClass} 
                                            onChange={(e) => setSelectedClass(e.target.value)}
                                            disabled={availableClasses.length === 0}
                                            class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl px-3.5 py-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition appearance-none disabled:bg-slate-100 disabled:text-slate-400"
                                        >
                                            {availableClasses.map(cls => (
                                                <option key={cls} value={cls}>{cls}</option>
                                            ))}
                                        </select>
                                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-500">
                                            <i class="fa-solid fa-chevron-down text-xs mr-1"></i>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="flex items-center justify-end">
                                <div class="bg-emerald-50/50 rounded-xl px-4 py-3 border border-emerald-100 flex items-center gap-3 w-full md:w-auto">
                                    <i class="fa-solid fa-users text-emerald-600 text-lg"></i>
                                    <div>
                                        <span class="text-xs text-slate-500 font-medium block">Jumlah Murid Terpilih</span>
                                        <span class="text-sm font-bold text-slate-800">
                                            {(STUDENT_DATA[selectedYear]?.[selectedClass] || []).length} Orang Murid
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {}
                    <main class="flex-1 max-w-7xl w-full mx-auto p-4 flex flex-col gap-6">

                        {/* TAB 1: PEREKODAN DATA */}
                        {activeTab === "perekodan" && (
                            <div class="flex flex-col gap-6">
                                {/* Standard Pembelajaran & Bidang Dropdowns */}
                                <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm flex flex-col lg:flex-row gap-4">
                                    <div class="lg:w-1/4">
                                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">3. Bidang Keilmuan</label>
                                        <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-1 gap-2">
                                            {BIDANGS.map(bidang => (
                                                <button
                                                    key={bidang}
                                                    onClick={() => setSelectedBidang(bidang)}
                                                    class={`text-left px-4 py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-between ${
                                                        selectedBidang === bidang 
                                                        ? "bg-emerald-600 text-white shadow-sm" 
                                                        : "bg-slate-50 hover:bg-slate-100 text-slate-700"
                                                    }`}
                                                >
                                                    <span>{bidang}</span>
                                                    <span class="hidden lg:inline bg-white/20 px-2 py-0.5 rounded-full text-[10px]">
                                                        {STANDARDS_DATA[selectedYear]?.[bidang]?.length || 0} SP
                                                    </span>
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div class="flex-1">
                                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">
                                            4. Standard Pembelajaran (SP) yang Diuji

                                            <select

                                    </p>
                                </div>
                                <div class="grid grid-cols-2 gap-3 mt-6">
                                    <button
                                        onClick={() => setConfirmReset(false)}
                                        class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2.5 rounded-xl text-sm transition"
                                    >
                                        Batal
                                    </button>
                                    <button
                                        onClick={resetClassScores}
                                        class="bg-rose-600 hover:bg-rose-700 text-white font-semibold py-2.5 rounded-xl text-sm transition"
                                    >
                                        Ya, Padam Semua
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* App Footer */}
                    <footer class="bg-slate-100 border-t border-slate-200 py-6 text-center text-xs text-slate-500 font-medium mt-12 no-print">
                        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-4">
                            <p>© {new Date().getFullYear()} Rekod Pentaksiran Pendidikan Islam. Hak Cipta Terpelihara.</p>
                            <div class="flex gap-4">
                                <a href="#" class="hover:text-emerald-700">Dokumentasi</a>
                                <span>•</span>
                                <a href="#" class="hover:text-emerald-700">Panduan Pengguna</a>
                            </div>
                        </div>
                    </footer>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('app'));
        root.render(<App />);
    </script>
</body>
</html>
